name: Build and Publish Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'zenora-v*'

permissions:
  contents: write

concurrency:
  group: zenorachat-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      APP_PACKAGE: ${{ vars.ZENORA_APPLICATION_ID || 'ir.zenora.zenorachat' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ZENORA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZENORA_RELEASE_KEYSTORE_BASE64 }}
      ZENORA_RELEASE_STORE_PASSWORD: ${{ secrets.ZENORA_RELEASE_STORE_PASSWORD }}
      ZENORA_RELEASE_KEY_ALIAS: ${{ secrets.ZENORA_RELEASE_KEY_ALIAS }}
      ZENORA_RELEASE_KEY_PASSWORD: ${{ secrets.ZENORA_RELEASE_KEY_PASSWORD }}
      ZENORA_FIREBASE_JSON_BASE64: ${{ secrets.ZENORA_FIREBASE_JSON_BASE64 }}
      ZENORA_GOOGLE_MAPS_API_KEY: ${{ secrets.ZENORA_GOOGLE_MAPS_API_KEY }}
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: true

      - name: Fetch pinned submodules in parallel
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1 --jobs=8

      - name: Apply Zenora build optimizations
        run: python3 .github/scripts/apply-build-optimizations.py

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH ZENORA_RELEASE_KEYSTORE_BASE64 ZENORA_RELEASE_STORE_PASSWORD ZENORA_RELEASE_KEY_ALIAS ZENORA_RELEASE_KEY_PASSWORD ZENORA_FIREBASE_JSON_BASE64; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            echo "Configure the production secrets described in README.md before publishing a Release."
            exit 1
          fi
          [[ "$APP_PACKAGE" != "org.telegram.messenger" ]] || {
            echo "::error::Set vars.ZENORA_APPLICATION_ID to your own package ID before Release."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after the final license prompt; with pipefail, yes receives
          # SIGPIPE and would incorrectly fail the workflow after successful acceptance.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          [[ -d "$SDK_ROOT" ]] || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --version

      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          ccache --version
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore native compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restore Zenora signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ZENORA_RELEASE_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore
          keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$ZENORA_RELEASE_STORE_PASSWORD" -alias "$ZENORA_RELEASE_KEY_ALIAS" >/dev/null
          echo "Release keystore is readable and contains the configured alias."

      - name: Configure production Zenora app
        run: |
          python3 scripts/configure-fork.py \
            --mode release \
            --application-id "$APP_PACKAGE"

      - name: Build signed universal Release APK
        run: |
          set -euo pipefail
          mkdir -p dist
          set -o pipefail
          ./gradlew \
            --stacktrace \
            --build-cache \
            --parallel \
            --max-workers=4 \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PZENORA_ABIS="armeabi-v7a,arm64-v8a,x86,x86_64" \
            -PZENORA_USE_CCACHE=true \
            -PRELEASE_STORE_PASSWORD="$ZENORA_RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ZENORA_RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ZENORA_RELEASE_KEY_PASSWORD" \
            :TMessagesProj_App:assembleAfatRelease
          ccache --show-stats --verbose | tee dist-ccache-stats.txt

      - name: Validate APK and prepare release assets
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find TMessagesProj_App/build/outputs/apk/afat/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK_SOURCE" ]] || { echo "::error::Gradle did not produce the AFAT Release APK"; exit 1; }

          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          mkdir -p dist
          OUTPUT="dist/ZenoraChat-${VERSION_NAME}-${VERSION_CODE}-universal.apk"
          cp "$APK_SOURCE" "$OUTPUT"
          APP_PACKAGE="$APP_PACKAGE" EXPECTED_ABIS="armeabi-v7a,arm64-v8a,x86,x86_64" bash scripts/validate-apk.sh release "$OUTPUT"
          sha256sum "$OUTPUT" > dist/SHA256SUMS
          if [[ -f dist-ccache-stats.txt ]]; then cp dist-ccache-stats.txt dist/ccache-stats.txt; fi

          UPSTREAM_SHA="$(cat UPSTREAM_COMMIT.txt 2>/dev/null || echo unknown)"
          {
            echo "# ZenoraChat ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "Unofficial ZenoraChat Android client based on the Telegram Android open-source project."
            echo
            echo "## Build"
            echo "- Telegram version: ${VERSION_NAME}"
            echo "- Telegram version code: ${VERSION_CODE}"
            echo "- Application ID: ${APP_PACKAGE}"
            echo "- Architectures: armeabi-v7a, arm64-v8a, x86, x86_64"
            echo "- Source commit: [${UPSTREAM_SHA}](https://github.com/TelegramMessenger/Telegram-Android/commit/${UPSTREAM_SHA})"
            echo "- Build workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Verification"
            echo "SHA-256 is provided in `SHA256SUMS`. The APK signature and package metadata were checked before publication."
            echo
            echo "This is an unofficial third-party client. It is not affiliated with Telegram."
          } > dist/release-notes.md

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="zenora-v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZenoraChat ${{ steps.release_meta.outputs.version }} (${{ steps.release_meta.outputs.version_code }})
          body_path: dist/release-notes.md
          files: |
            dist/ZenoraChat-*-universal.apk
            dist/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
