name: Durable optimistic message-edit tests
on:
  push:
    branches:
      - feat/zenora-durable-optimistic-message-edit-android-20261128
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenora-message-edit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edit-regression:
    name: SQLite, race and API contract regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: true
      - name: Fetch pinned submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1 --jobs=8
      - name: Apply Zenora build optimizations
        run: python3 .github/scripts/apply-build-optimizations.py
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install pinned Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Run durable edit source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/zenora_durable_message_edit_contract_test.py
          python3 scripts/tests/zenora_durable_message_edit_behavior_test.py
          python3 scripts/tests/zenora_message_mutations_contract_test.py
          python3 scripts/tests/zenora_message_mutation_sync_contract_test.py
          python3 scripts/tests/zenora_message_edit_reconciliation_behavior_test.py
          python3 scripts/tests/zenora_message_send_live_race_contract_test.py
          python3 scripts/tests/ZenoraOutboxContractTest.py
          python3 scripts/tests/ZenoraOutboxMigrationTest.py
      - name: Compile Android Java sources (no APK or release output)
        run: ./gradlew :TMessagesProj:compileDebugJavaWithJavac --no-daemon --stacktrace
