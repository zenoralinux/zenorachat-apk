name: ZenoraChat Stage 1 Release

on:
  push:
    branches:
      - feat/zenora-native-login-dialogs-20261121
      - feat/zenora-native-bearer-client-20261121
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/zenora-stage1-release.yml'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'UPSTREAM_COMMIT.txt'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Universal APK and publish preview
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_PACKAGE: ir.zenora.zenorachat
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      ZENORA_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
      ZENORA_FAST_DEBUG: 'false'
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: true

      - name: Fetch pinned submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1 --jobs=8

      - name: Apply Zenora build optimizations
        run: python3 .github/scripts/apply-build-optimizations.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Zenora branding and native-only API credentials
        run: |
          set -euo pipefail
          python3 scripts/configure-fork.py --mode debug --application-id "$APP_PACKAGE"

      - name: Build universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --stacktrace \
            --console=plain \
            --build-cache \
            --parallel \
            --max-workers=4 \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PZENORA_ABIS="$ZENORA_ABIS" \
            -PZENORA_FAST_DEBUG="$ZENORA_FAST_DEBUG" \
            :TMessagesProj_App:assembleAfatDebug

      - name: Validate and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find TMessagesProj_App/build/outputs/apk/afat/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK_SOURCE" ]] || { echo "::error::Debug APK was not produced"; exit 1; }
          mkdir -p dist
          OUTPUT="dist/ZenoraChat-Stage1-universal-debug.apk"
          cp "$APK_SOURCE" "$OUTPUT"
          APP_PACKAGE="$APP_PACKAGE" EXPECTED_ABIS="$ZENORA_ABIS" bash scripts/validate-apk.sh debug "$OUTPUT"
          sha256sum "$OUTPUT" > dist/SHA256SUMS
          {
            echo "Product: ZenoraChat"
            echo "Milestone: Stage 1 - native login and chat list"
            echo "Build type: Universal Debug (debug-key signed)"
            echo "Application ID: ${APP_PACKAGE}.beta"
            echo "ABIs: ${ZENORA_ABIS}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
          } > dist/BUILD-INFO.txt

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: ZenoraChat-Stage1-universal-debug-${{ github.run_number }}
          path: |
            dist/ZenoraChat-Stage1-universal-debug.apk
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify deployed Zenora native API
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://miladalizadw.ir/telegram/api/native/health.php"
          RESPONSE="$(curl --fail --silent --show-error --max-time 25 -H 'Accept: application/json' "$HEALTH_URL")"
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("service") == "zenora-native-api" and d.get("database") is True and d.get("api_version") == 1, "Native API health check failed"; print("Zenora native API and database are ready.")'

      - name: Publish GitHub Release preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zenora-stage1-preview-${{ github.run_number }}
          name: ZenoraChat Stage 1 Preview ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          body: |
            Stage 1 preview: Zenora username/password login, encrypted native session persistence,
            and the current Telegram dialog-row UI populated from ZenoraChat rooms.

            This is a universal Debug APK signed with the Android debug key. It is a preview build,
            not a production-signed stable release.
          files: |
            dist/ZenoraChat-Stage1-universal-debug.apk
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
