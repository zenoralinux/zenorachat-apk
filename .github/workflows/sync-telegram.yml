name: Sync official Telegram source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'upstream.json'
      - '.github/workflows/sync-telegram.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: zenorachat-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Import or propose latest upstream source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Zenora repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read upstream configuration
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY="$(jq -r '.repository' upstream.json)"
          BRANCH="$(jq -r '.branch' upstream.json)"
          [[ -n "$REPOSITORY" && "$REPOSITORY" != "null" ]]
          [[ -n "$BRANCH" && "$BRANCH" != "null" ]]
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Fetch exact upstream tree (shallow, without downloading submodule payloads)
        id: source
        env:
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "https://github.com/${UPSTREAM_REPOSITORY}.git" "${UPSTREAM_BRANCH}"
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Imported upstream candidate: $UPSTREAM_SHA"

      - name: Prepare initial import or an upstream update
        id: prepare
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ALREADY_IMPORTED=false
          if [[ -f settings.gradle && -f .gitmodules ]]; then
            SOURCE_ALREADY_IMPORTED=true
          fi
          echo "source_already_imported=$SOURCE_ALREADY_IMPORTED" >> "$GITHUB_OUTPUT"

          if [[ -f UPSTREAM_COMMIT.txt ]] && [[ "$(tr -d '\r\n' < UPSTREAM_COMMIT.txt)" == "$UPSTREAM_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is already synchronized."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          META_DIR="$RUNNER_TEMP/zenora-meta"
          mkdir -p "$META_DIR"
          cp -a .github scripts README.md upstream.json "$META_DIR/"
          if [[ -d docs ]]; then cp -a docs "$META_DIR/docs"; fi

          if [[ "$SOURCE_ALREADY_IMPORTED" == "true" ]]; then
            git switch -c sync/telegram-master
          fi

          # Import the upstream Git tree itself. This preserves real Git submodule
          # gitlinks and their pinned SHAs without flattening or downloading them here.
          git read-tree --reset -u "$UPSTREAM_SHA"

          cp -a "$META_DIR/." "$GITHUB_WORKSPACE/"
          mkdir -p docs
          git show "$UPSTREAM_SHA:README.md" > docs/TELEGRAM_UPSTREAM_README.md
          printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_COMMIT.txt

          # Reapply Zenora's build-only overlay after every upstream tree replacement.
          python3 .github/scripts/apply-build-optimizations.py
          python3 .github/scripts/apply-zenora-native.py

          git add -f .github scripts README.md upstream.json UPSTREAM_COMMIT.txt docs/TELEGRAM_UPSTREAM_README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync Telegram Android source ${UPSTREAM_SHA}"

      - name: Publish initial source snapshot to main
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.source_already_imported == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/main
          gh workflow run build-debug.yml --ref main --repo "$GITHUB_REPOSITORY"
          {
            echo "### Telegram source imported"
            echo
            echo "- Upstream commit: `$UPSTREAM_SHA`"
            echo "- Destination: `main`"
            echo "- Debug build: queued through workflow dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push update branch and open or refresh pull request
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.source_already_imported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="sync/telegram-master"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          EXISTING_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$EXISTING_PR" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Sync Telegram Android upstream ($UPSTREAM_SHA)" \
              --body "Automated upstream source update.\n\n- Telegram repository: https://github.com/TelegramMessenger/Telegram-Android\n- Upstream commit: `$UPSTREAM_SHA`\n- Submodules remain pinned to the exact upstream gitlink SHAs.\n- A Debug APK build is dispatched for this branch.\n\nReview the diff and build result before merging. This PR replaces the upstream source snapshot; keep Zenora-specific changes in dedicated commits and review conflicts carefully."
          else
            gh pr edit "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" \
              --title "Sync Telegram Android upstream ($UPSTREAM_SHA)" \
              --body "Automated upstream source update.\n\n- Telegram repository: https://github.com/TelegramMessenger/Telegram-Android\n- Upstream commit: `$UPSTREAM_SHA`\n- Submodules remain pinned to the exact upstream gitlink SHAs.\n- A Debug APK build is dispatched for this branch.\n\nReview the diff and build result before merging."
          fi

          gh workflow run build-debug.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          {
            echo "### Telegram upstream update proposed"
            echo
            echo "- Upstream commit: `$UPSTREAM_SHA`"
            echo "- Branch: `$BRANCH`"
            echo "- Pull request: #$EXISTING_PR (if newly created, see the Pull Requests tab)"
            echo "- Debug build: queued for the update branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report unchanged upstream
        if: steps.prepare.outputs.changed == 'false'
        run: echo "No upstream changes detected; no source commit or build was necessary."
