name: Build Debug APK
# Branch-specific Debug Preview: permanent Zenora mute/unmute.
run-name: Debug APK (${{ inputs.build_mode || 'fast ARM64' }})

on:
  push:
    branches: [feat/zenora-live-text-messaging-20261125, main, fix/zenora-login-dialogs-stability-20261122, fix/zenora-session-rooms-stability-20261122, fix/zenora-dialog-avatars-mute-sender-20261122, fix/zenora-dialog-sync-cache-20261122, fix/zenora-dialog-sync-fast-refresh-20261122, fix/zenora-archive-sync-20261122, fix/zenora-pin-operations-20261122, fix/zenora-delete-leave-android-20261122, fix/zenora-mute-verified-android-20261122, fix/zenora-mute-storage-flags-android-20261122, feat/zenora-presence-typing-unread-indicators-android-20261122, fix/zenora-permanent-mute-unmute-20261123, fix/zenora-chat-list-mute-indicator-refresh-20261123, fix/zenora-verified-chat-mute-indicator-20261123, feat/zenora-native-media-previews-20261123, fix/zenora-media-preview-thumbnails-20261123, feat/zenora-read-unread-actions-20261124, feat/zenora-basic-text-chat-20261125, feat/zenora-older-history-pagination-20261125, feat/zenora-text-message-send-20261125]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/build-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Fast ARM64 APK or full four-ABI Universal APK'
        required: true
        type: choice
        options:
          - fast
          - universal
        default: fast

permissions:
  contents: write

concurrency:
  group: zenorachat-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build universal Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_PACKAGE: ${{ vars.ZENORA_APPLICATION_ID || 'ir.zenora.zenorachat' }}
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      ZENORA_FAST_DEBUG: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode != 'universal' }}
      ZENORA_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'universal' || 'fast' }}
      ZENORA_ABIS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: true

      - name: Fetch pinned submodules in parallel
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1 --jobs=8

      - name: Apply Zenora build optimizations
        run: python3 .github/scripts/apply-build-optimizations.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Zenora media-preview URLs and 30x30 thumbnail contract
        shell: bash
        run: |
          set -euo pipefail
          TEST_CLASSES="$RUNNER_TEMP/zenora-media-preview-url-tests"
          mkdir -p "$TEST_CLASSES"
          javac -d "$TEST_CLASSES" \
            TMessagesProj/src/main/java/org/telegram/messenger/ZenoraMediaPreviewUrl.java \
            scripts/tests/ZenoraMediaPreviewUrlTest.java
          java -cp "$TEST_CLASSES" org.telegram.messenger.ZenoraMediaPreviewUrlTest
          grep -F '.setImage(location, "30_30"' TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          grep -F 'attachment.chatListThumbnailUrl' TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after the final license prompt; with pipefail, yes receives
          # SIGPIPE and would incorrectly fail the workflow after successful acceptance.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          [[ -d "$SDK_ROOT" ]] || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          java -version
          sdkmanager --version

      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          ccache --version
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore native compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Zenora branding and Debug Firebase placeholder
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 scripts/configure-fork.py \
            --mode debug \
            --application-id "$APP_PACKAGE"

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Build mode: $ZENORA_BUILD_MODE"
          echo "Target ABIs: $ZENORA_ABIS"
          echo "CPU cores: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_STARTED=$(date +%s)
          set +e
          ./gradlew \
            --stacktrace \
            --console=plain \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --profile \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PZENORA_ABIS="$ZENORA_ABIS" \
            -PZENORA_USE_CCACHE=true \
            -PZENORA_FAST_DEBUG="$ZENORA_FAST_DEBUG" \
            :TMessagesProj_App:assembleAfatDebug
          BUILD_STATUS=$?
          set -e
          BUILD_DURATION=$(( $(date +%s) - BUILD_STARTED ))
          echo "Build duration: ${BUILD_DURATION}s" | tee dist/build-duration.txt
          ccache --show-stats --verbose | tee dist/ccache-stats.txt
          if [[ "$BUILD_STATUS" -ne 0 ]]; then exit "$BUILD_STATUS"; fi

      - name: Validate and package Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find TMessagesProj_App/build/outputs/apk/afat/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK_SOURCE" ]] || { echo "::error::Gradle did not produce the AFAT Debug APK"; exit 1; }
          mkdir -p dist
          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          OUTPUT="dist/ZenoraChat-${VERSION_NAME}-${VERSION_CODE}-debug-${ZENORA_BUILD_MODE}.apk"
          cp "$APK_SOURCE" "$OUTPUT"
          APP_PACKAGE="$APP_PACKAGE" EXPECTED_ABIS="$ZENORA_ABIS" bash scripts/validate-apk.sh debug "$OUTPUT"
          if [[ "$ZENORA_BUILD_MODE" == "fast" ]]; then
            cp "$OUTPUT" dist/ZenoraChat-debug-arm64.apk
            sha256sum "$OUTPUT" dist/ZenoraChat-debug-arm64.apk > dist/SHA256SUMS
          else
            sha256sum "$OUTPUT" > dist/SHA256SUMS
          fi
          PROFILE_SOURCE="$(find build/reports/profile -maxdepth 1 -type f -name 'profile-*.html' -print -quit 2>/dev/null || true)"
          if [[ -n "$PROFILE_SOURCE" ]]; then cp "$PROFILE_SOURCE" dist/GRADLE-BUILD-PROFILE.html; fi
          {
            echo "Build: Debug / AFAT"
            echo "Build mode: ${ZENORA_BUILD_MODE}"
            echo "App: ZenoraChat"
            echo "Application ID: ${APP_PACKAGE}.beta"
            echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "Target ABIs: ${ZENORA_ABIS}"
            echo "Source commit: $(cat UPSTREAM_COMMIT.txt 2>/dev/null || git rev-parse HEAD)"
            echo "Repository commit: $(git rev-parse HEAD)"
          } > dist/BUILD-INFO.txt

      - name: Prepare rolling Debug Preview release notes
        if: env.ZENORA_BUILD_MODE == 'fast' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.ref == 'refs/heads/fix/zenora-login-dialogs-stability-20261122' || github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-sync-fast-refresh-20261122' || github.ref == 'refs/heads/fix/zenora-archive-sync-20261122' || github.ref == 'refs/heads/fix/zenora-pin-operations-20261122' || github.ref == 'refs/heads/fix/zenora-delete-leave-android-20261122' || github.ref == 'refs/heads/fix/zenora-mute-verified-android-20261122' || github.ref == 'refs/heads/fix/zenora-mute-storage-flags-android-20261122' || github.ref == 'refs/heads/fix/zenora-permanent-mute-unmute-20261123' || github.ref == 'refs/heads/fix/zenora-verified-chat-mute-indicator-20261123' || github.ref == 'refs/heads/fix/zenora-chat-list-mute-indicator-refresh-20261123' || github.ref == 'refs/heads/feat/zenora-presence-typing-unread-indicators-android-20261122' || github.ref == 'refs/heads/feat/zenora-native-media-previews-20261123' || github.ref == 'refs/heads/fix/zenora-media-preview-thumbnails-20261123' || github.ref == 'refs/heads/feat/zenora-read-unread-actions-20261124' || github.ref == 'refs/heads/feat/zenora-basic-text-chat-20261125' || github.ref == 'refs/heads/feat/zenora-older-history-pagination-20261125' || github.ref == 'refs/heads/feat/zenora-text-message-send-20261125' || github.ref == 'refs/heads/feat/zenora-live-text-messaging-20261125')
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          UPSTREAM_SHA="$(cat UPSTREAM_COMMIT.txt 2>/dev/null || echo unknown)"
          REPO_SHA="$(git rev-parse HEAD)"
          if [[ -n "$TELEGRAM_API_ID" && -n "$TELEGRAM_API_HASH" ]]; then
            LOGIN_STATUS="Configured: Telegram API credentials are present."
          else
            LOGIN_STATUS="WARNING: this preview was built with placeholder Telegram API credentials. Telegram sign-in and API requests will not work until TELEGRAM_API_ID and TELEGRAM_API_HASH are configured as repository secrets."
          fi
          {
            echo "# ZenoraChat Debug Preview"
            echo
            if [[ "$GITHUB_REF" == "refs/heads/feat/zenora-live-text-messaging-20261125" ]]; then
              echo "ZenoraChat checks for new plain-text messages about every two seconds only while the active native conversation is foregrounded."
              echo
              echo "- Incoming rows are validated, deduplicated and appended through Telegram native message models and local storage."
              echo "- Live after_message_id state is independent from the older-history before_message_id cursor; existing server-confirmed send reconciliation remains intact."
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-live-text-messaging-20261125"
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-text-message-send-20261125" ]]; then
              echo "ZenoraChat text messages are sent through the authenticated PHP API; the native Telegram Composer remains in place and the server ID is used for the native message object."
              echo
              echo "- Failed or uncertain requests keep the draft; timeout reconciliation checks history instead of blindly resending."
              echo "- The older-history before_message_id cursor is not advanced by sending."
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-text-history-cursor-pagination-20261125"
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-older-history-pagination-20261125" ]]; then
              echo "ZenoraChat older text-history pages use a validated before_message_id cursor and Telegram's native backward-history pipeline."
              echo
              echo "- Page size is capped at 50; duplicate/in-flight requests are suppressed and failed pages remain retryable."
              echo "- Native ChatActivity, Telegram's reverse-layout adapter and scroll anchoring are retained."
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-text-history-cursor-pagination-20261125"
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-basic-text-chat-20261125" ]]; then
              echo "ZenoraChat initial text history is loaded into Telegram's native ChatActivity with native TLRPC messages and MessageObject instances."
              echo
              echo "- Only initial text history is enabled; send, live updates, pagination and media remain out of scope."
              echo "- Companion Web/API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-basic-text-history-api-20261125"
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-read-unread-actions-20261124" ]]; then
              echo "Zenora Read/Unread actions: Mark as Read clears the per-user marker and advances only a valid real-read cursor; Mark as Unread sets the personal marker without rewinding room_reads."
              echo
              echo "- The build includes the dedicated Zenora read/unread API integration and native mention/reaction read synchronization."
              echo "- Companion Web/API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-read-unread-api-20261124"
              echo "- PHP API source release: https://github.com/zenoralinux/zenorachat/releases/tag/zenora-read-unread-api-20261124"
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-media-preview-thumbnails-20261123" ]]; then
              echo "Zenora media-preview image loading fix: app-root-relative thumbnail URLs resolve against the site origin, invalid duplicated paths are rejected, and DialogCell loads only dedicated exact 30x30 chat-list derivatives."
              echo
              echo "- Added regression tests for root-relative, app-relative, absolute, malformed and unsafe thumbnail URLs."
              echo "- Preserved the independent message-viewer poster and original media paths; they are never used as chat-list fallbacks."
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-native-media-previews-20261123" ]]; then
              echo "Native Telegram media previews: the rooms.php preview contract maps to Telegram TL models for Photo, Video, Voice, Music, Video Note, GIF, stickers, documents and albums."
              echo
              echo "- DialogCell loads only the API's compact chat-list derivatives through Telegram ImageLoader."
              echo "- Albums remain one logical Zenora message and show up to three ordered thumbnails, localized total count and +N overflow."
              echo "- Per-account media preview metadata is atomically replaced from cached and live room snapshots."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-verified-chat-mute-indicator-20261123" ]]; then
              echo "Verified chat mute indicator fix: verified badges and mute/unmute icons now have independent positions and reserved title width for RTL and LTR layouts."
              echo
              echo "- The change is isolated to DialogCell rendering; API-backed mute synchronization remains unchanged."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-chat-list-mute-indicator-refresh-20261123" ]]; then
              echo "Zenora mute indicator refresh: dialog-list diff snapshots now include per-dialog mute state, DialogCell's layout cache invalidates on mute changes, and snapshot reload waits until all notification preferences are applied."
              echo
              echo "- Permanent Zenora mute/unmute remains API-backed; timed choices stay hidden on Android and swipe mute remains on its original path."
              echo "- Main and archived dialog rows are rebound when the server-confirmed mute state changes."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-permanent-mute-unmute-20261123" ]]; then
              echo "Permanent Zenora mute/unmute: central notification actions are API-backed, timed choices are hidden, server-confirmed state is reflected in Telegram's native notification model, and swipe mute remains on its original path."
              echo
              echo "- Timed mute support remains available to the web client; Android Zenora requests always send mute_seconds=0."
              echo "- Multi-selection and folder mute/unmute use the same per-user API path."
              echo "- Existing native DialogCell mute indicators are preserved."
            elif [[ "$GITHUB_REF" == "refs/heads/feat/zenora-presence-typing-unread-indicators-android-20261122" ]]; then
              echo "Native presence, typing and unread indicators: server-clock-aware DM presence maps to Telegram's UserStatus model; structured Zenora typers use Telegram's native printing engine; unread mentions and reactions map directly to TL_dialog counters."
              echo
              echo "- Companion Web/API branch: https://github.com/zenoralinux/zenorachat/tree/feat/zenora-presence-typing-unread-indicators-api-20261122"
              echo "- Cached snapshots never replay online or typing indicators."
              echo "- Existing Telegram DialogCell rendering and layout remain unchanged."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-mute-storage-flags-android-20261122" ]]; then
              echo "Mute/Unmute storage correction: timed mute deadlines are encoded as absolute Unix timestamps in Telegram dialog flags, matching native storage and expiry handling."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-mute-csrf-recovery-api-20261122"
              echo "- Web CSRF recovery refreshes stale tokens after HTTP 419 and retries each rejected request once."
              echo "- Native notification state retains permanent and timed mute behavior while leaving Telegram's dialog UI unchanged."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-mute-verified-android-20261122" ]]; then
              echo "Native Mute/Unmute and verified-badge integration: timed and permanent mute state is stored by Zenora and mapped into Telegram's native notification model; verified users, groups and channels use Telegram's built-in verification badge."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-mute-verified-api-20261122"
              echo "- CSRF recovery, server-confirmed mute state, processed-count checks and server-clock deadlines are enabled."
              echo "- Telegram's original DialogCell and notification UI remain unchanged."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-delete-leave-android-20261122" ]]; then
              echo "Native Delete/Leave synchronization: Delete, Leave, single and multi-select operations commit to Zenora after Telegram's native Undo window; per-chat delete scope and idempotent retries are enforced by the API."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-delete-leave-api-20261122"
              echo "- Saved Messages keeps its room identity; group/channel owners cannot leave before ownership transfer."
              echo "- Swipe-delete deliberately remains on its previous Telegram path and is not routed through the Zenora adapter."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-pin-operations-20261122" ]]; then
              echo "Native Pin synchronization: Pin, Unpin, multi-select and drag ordering are persisted through Zenora PHP and restored from the server snapshot."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-pin-operations-api-20261122"
              echo "- Main-list three-pin limit and independent Archive pin ordering are enforced server-side."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-archive-sync-20261122" ]]; then
              echo "Native archive synchronization: Telegram swipe, multi-select, and Undo use Zenora PHP; Archive folder row is rebuilt from each validated snapshot."
              echo
              echo "- API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-archive-sync-20261122"
              echo "- Archive mute boundaries and independent Archive pin ordering are synchronized server-side."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-sync-fast-refresh-20261122" ]]; then
              echo "Fast dialog sync: refresh every 2 seconds while the main or archived dialog list is visible, and every 4 seconds elsewhere while the app is foregrounded."
              echo
              echo "- Retains coalesced requests, validated atomic snapshot publishing, and the per-account SQLite cache."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-sync-cache-20261122" ]]; then
              echo "Dialog sync reliability: foreground refresh for main and archived dialogs, coalesced requests, validated atomic snapshot publishing, and a per-account SQLite cache."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-dialog-sync-api-20261122"
              echo "- Cache fallback keeps the last valid snapshot visible during network and parse failures."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122" ]]; then
              echo "Native dialog completion: user/group avatars, Telegram-native mute indicators with server-backed durations, and real last-message sender identities."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-dialog-avatars-mute-sender-api-20261122"
              echo "- Companion API commit: fb50d70ce32b03ac67f005381c251bac70bdb289"
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-session-rooms-stability-20261122" ]]; then
              echo "Follow-up stability release: persistent Zenora login, room-list retry, legacy group membership repair, and complete native dialog sorting."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-rooms-membership-compat-20261122"
              echo "- Companion API commit: d36e15da3f4e2207f80fa7a64181979e51f4b482"
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-login-dialogs-stability-20261122" ]]; then
              echo "Dedicated test release for ZenoraChat Android login and dialog-list stability."
            else
              echo "This rolling pre-release is replaced after each successful Fast ARM64 Debug build on main. It is a test build, not a stable release."
            fi
            echo
            echo "## Build information"
            echo "- App version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "- Application ID: ${APP_PACKAGE}.beta"
            echo "- ABI: arm64-v8a"
            echo "- Upstream commit: ${UPSTREAM_SHA}"
            echo "- Repository commit: ${REPO_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Important"
            echo "$LOGIN_STATUS"
            echo "The app uses the Debug signing configuration and package suffix .beta. It is not a production-signed build."
          } > dist/debug-preview-notes.md

      - name: Upload Debug APK and build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ZenoraChat-Debug-${{ env.ZENORA_BUILD_MODE }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Update rolling Debug Preview tag
