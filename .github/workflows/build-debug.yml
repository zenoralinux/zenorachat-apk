name: Build Debug APK
run-name: Debug APK (${{ inputs.build_mode || 'fast ARM64' }})

on:
  push:
    branches: [main]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
      - '.github/workflows/build-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Fast ARM64 APK or full four-ABI Universal APK'
        required: true
        type: choice
        options:
          - fast
          - universal
        default: fast

permissions:
  contents: read

concurrency:
  group: zenorachat-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build universal Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_PACKAGE: ${{ vars.ZENORA_APPLICATION_ID || 'ir.zenora.zenorachat' }}
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      ZENORA_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'universal' || 'fast' }}
      ZENORA_ABIS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after the final license prompt; with pipefail, yes receives
          # SIGPIPE and would incorrectly fail the workflow after successful acceptance.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          [[ -d "$SDK_ROOT" ]] || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          java -version
          sdkmanager --version

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Zenora branding and Debug Firebase placeholder
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 scripts/configure-fork.py \
            --mode debug \
            --application-id "$APP_PACKAGE"

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Build mode: $ZENORA_BUILD_MODE"
          echo "Target ABIs: $ZENORA_ABIS"
          echo "CPU cores: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_STARTED=$(date +%s)
          /usr/bin/time -v -o dist/build-resource-usage.txt ./gradlew \
            --stacktrace \
            --console=plain \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --profile \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PZENORA_ABIS="$ZENORA_ABIS" \
            :TMessagesProj_App:assembleAfatDebug
          BUILD_DURATION=$(( $(date +%s) - BUILD_STARTED ))
          echo "Build duration: ${BUILD_DURATION}s" | tee dist/build-duration.txt

      - name: Validate and package Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find TMessagesProj_App/build/outputs/apk/afat/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK_SOURCE" ]] || { echo "::error::Gradle did not produce the AFAT Debug APK"; exit 1; }
          mkdir -p dist
          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          OUTPUT="dist/ZenoraChat-${VERSION_NAME}-${VERSION_CODE}-debug-${ZENORA_BUILD_MODE}.apk"
          cp "$APK_SOURCE" "$OUTPUT"
          APP_PACKAGE="$APP_PACKAGE" EXPECTED_ABIS="$ZENORA_ABIS" bash scripts/validate-apk.sh debug "$OUTPUT"
          sha256sum "$OUTPUT" > dist/SHA256SUMS
          PROFILE_SOURCE="$(find build/reports/profile -maxdepth 1 -type f -name 'profile-*.html' -print -quit 2>/dev/null || true)"
          if [[ -n "$PROFILE_SOURCE" ]]; then cp "$PROFILE_SOURCE" dist/GRADLE-BUILD-PROFILE.html; fi
          {
            echo "Build: Debug / AFAT"
            echo "Build mode: ${ZENORA_BUILD_MODE}"
            echo "App: ZenoraChat"
            echo "Application ID: ${APP_PACKAGE}.beta"
            echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "Target ABIs: ${ZENORA_ABIS}"
            echo "Source commit: $(cat UPSTREAM_COMMIT.txt 2>/dev/null || git rev-parse HEAD)"
            echo "Repository commit: $(git rev-parse HEAD)"
          } > dist/BUILD-INFO.txt

      - name: Upload Debug APK and build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ZenoraChat-Debug-${{ env.ZENORA_BUILD_MODE }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
