name: Build Debug APK
run-name: Debug APK (${{ inputs.build_mode || 'fast ARM64' }})

on:
  push:
    branches: [main, fix/zenora-login-dialogs-stability-20261122, fix/zenora-session-rooms-stability-20261122, fix/zenora-dialog-avatars-mute-sender-20261122, fix/zenora-dialog-sync-cache-20261122]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/build-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.gitmodules'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_Modules/**'
      - 'UPSTREAM_COMMIT.txt'
      - 'scripts/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Fast ARM64 APK or full four-ABI Universal APK'
        required: true
        type: choice
        options:
          - fast
          - universal
        default: fast

permissions:
  contents: write

concurrency:
  group: zenorachat-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build universal Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_PACKAGE: ${{ vars.ZENORA_APPLICATION_ID || 'ir.zenora.zenorachat' }}
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      ZENORA_FAST_DEBUG: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode != 'universal' }}
      ZENORA_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'universal' || 'fast' }}
      ZENORA_ABIS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'universal' && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: true

      - name: Fetch pinned submodules in parallel
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1 --jobs=8

      - name: Apply Zenora build optimizations
        run: python3 .github/scripts/apply-build-optimizations.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after the final license prompt; with pipefail, yes receives
          # SIGPIPE and would incorrectly fail the workflow after successful acceptance.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          [[ -d "$SDK_ROOT" ]] || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          java -version
          sdkmanager --version

      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          ccache --version
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore native compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zenora-ccache-v1-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Zenora branding and Debug Firebase placeholder
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 scripts/configure-fork.py \
            --mode debug \
            --application-id "$APP_PACKAGE"

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Build mode: $ZENORA_BUILD_MODE"
          echo "Target ABIs: $ZENORA_ABIS"
          echo "CPU cores: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_STARTED=$(date +%s)
          set +e
          ./gradlew \
            --stacktrace \
            --console=plain \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --profile \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PZENORA_ABIS="$ZENORA_ABIS" \
            -PZENORA_USE_CCACHE=true \
            -PZENORA_FAST_DEBUG="$ZENORA_FAST_DEBUG" \
            :TMessagesProj_App:assembleAfatDebug
          BUILD_STATUS=$?
          set -e
          BUILD_DURATION=$(( $(date +%s) - BUILD_STARTED ))
          echo "Build duration: ${BUILD_DURATION}s" | tee dist/build-duration.txt
          ccache --show-stats --verbose | tee dist/ccache-stats.txt
          if [[ "$BUILD_STATUS" -ne 0 ]]; then exit "$BUILD_STATUS"; fi

      - name: Validate and package Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find TMessagesProj_App/build/outputs/apk/afat/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK_SOURCE" ]] || { echo "::error::Gradle did not produce the AFAT Debug APK"; exit 1; }
          mkdir -p dist
          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          OUTPUT="dist/ZenoraChat-${VERSION_NAME}-${VERSION_CODE}-debug-${ZENORA_BUILD_MODE}.apk"
          cp "$APK_SOURCE" "$OUTPUT"
          APP_PACKAGE="$APP_PACKAGE" EXPECTED_ABIS="$ZENORA_ABIS" bash scripts/validate-apk.sh debug "$OUTPUT"
          if [[ "$ZENORA_BUILD_MODE" == "fast" ]]; then
            cp "$OUTPUT" dist/ZenoraChat-debug-arm64.apk
            sha256sum "$OUTPUT" dist/ZenoraChat-debug-arm64.apk > dist/SHA256SUMS
          else
            sha256sum "$OUTPUT" > dist/SHA256SUMS
          fi
          PROFILE_SOURCE="$(find build/reports/profile -maxdepth 1 -type f -name 'profile-*.html' -print -quit 2>/dev/null || true)"
          if [[ -n "$PROFILE_SOURCE" ]]; then cp "$PROFILE_SOURCE" dist/GRADLE-BUILD-PROFILE.html; fi
          {
            echo "Build: Debug / AFAT"
            echo "Build mode: ${ZENORA_BUILD_MODE}"
            echo "App: ZenoraChat"
            echo "Application ID: ${APP_PACKAGE}.beta"
            echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "Target ABIs: ${ZENORA_ABIS}"
            echo "Source commit: $(cat UPSTREAM_COMMIT.txt 2>/dev/null || git rev-parse HEAD)"
            echo "Repository commit: $(git rev-parse HEAD)"
          } > dist/BUILD-INFO.txt

      - name: Prepare rolling Debug Preview release notes
        if: env.ZENORA_BUILD_MODE == 'fast' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.ref == 'refs/heads/fix/zenora-login-dialogs-stability-20261122' || github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122')
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME" {print $2}' gradle.properties | tail -n1)"
          VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE" {print $2}' gradle.properties | tail -n1)"
          UPSTREAM_SHA="$(cat UPSTREAM_COMMIT.txt 2>/dev/null || echo unknown)"
          REPO_SHA="$(git rev-parse HEAD)"
          if [[ -n "$TELEGRAM_API_ID" && -n "$TELEGRAM_API_HASH" ]]; then
            LOGIN_STATUS="Configured: Telegram API credentials are present."
          else
            LOGIN_STATUS="WARNING: this preview was built with placeholder Telegram API credentials. Telegram sign-in and API requests will not work until TELEGRAM_API_ID and TELEGRAM_API_HASH are configured as repository secrets."
          fi
          {
            echo "# ZenoraChat Debug Preview"
            echo
            if [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-sync-cache-20261122" ]]; then
              echo "Dialog sync reliability: foreground refresh for main and archived dialogs, coalesced requests, validated atomic snapshot publishing, and a per-account SQLite cache."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-dialog-sync-api-20261122"
              echo "- Cache fallback keeps the last valid snapshot visible during network and parse failures."
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122" ]]; then
              echo "Native dialog completion: user/group avatars, Telegram-native mute indicators with server-backed durations, and real last-message sender identities."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-dialog-avatars-mute-sender-api-20261122"
              echo "- Companion API commit: fb50d70ce32b03ac67f005381c251bac70bdb289"
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-session-rooms-stability-20261122" ]]; then
              echo "Follow-up stability release: persistent Zenora login, room-list retry, legacy group membership repair, and complete native dialog sorting."
              echo
              echo "- Companion API branch: https://github.com/zenoralinux/zenorachat/tree/fix/zenora-rooms-membership-compat-20261122"
              echo "- Companion API commit: d36e15da3f4e2207f80fa7a64181979e51f4b482"
            elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-login-dialogs-stability-20261122" ]]; then
              echo "Dedicated test release for ZenoraChat Android login and dialog-list stability."
            else
              echo "This rolling pre-release is replaced after each successful Fast ARM64 Debug build on main. It is a test build, not a stable release."
            fi
            echo
            echo "## Build information"
            echo "- App version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "- Application ID: ${APP_PACKAGE}.beta"
            echo "- ABI: arm64-v8a"
            echo "- Upstream commit: ${UPSTREAM_SHA}"
            echo "- Repository commit: ${REPO_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Important"
            echo "$LOGIN_STATUS"
            echo "The app uses the Debug signing configuration and package suffix .beta. It is not a production-signed build."
          } > dist/debug-preview-notes.md

      - name: Upload Debug APK and build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ZenoraChat-Debug-${{ env.ZENORA_BUILD_MODE }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Update rolling Debug Preview tag
        if: env.ZENORA_BUILD_MODE == 'fast' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.ref == 'refs/heads/fix/zenora-login-dialogs-stability-20261122' || github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-sync-cache-20261122" ]]; then
            TAG="zenora-dialog-sync-cache-20261122"
          elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122" ]]; then
            TAG="zenora-dialog-avatars-mute-sender-20261122"
          elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-session-rooms-stability-20261122" ]]; then
            TAG="zenora-session-rooms-stability-20261122"
          elif [[ "$GITHUB_REF" == "refs/heads/fix/zenora-login-dialogs-stability-20261122" ]]; then
            TAG="zenora-login-dialogs-stability-20261122"
          else
            TAG="zenora-debug-latest"
          fi
          API="repos/${GITHUB_REPOSITORY}/git"
          if gh api "${API}/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "${API}/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "${API}/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          fi

      - name: Publish rolling Debug Preview to GitHub Releases
        if: env.ZENORA_BUILD_MODE == 'fast' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.ref == 'refs/heads/fix/zenora-login-dialogs-stability-20261122' || github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' || github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122')
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'zenora-debug-latest' || (github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122' && 'zenora-dialog-sync-cache-20261122' || (github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' && 'zenora-dialog-avatars-mute-sender-20261122' || (github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' && 'zenora-session-rooms-stability-20261122' || 'zenora-login-dialogs-stability-20261122'))) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref == 'refs/heads/main' && 'ZenoraChat Debug Preview (latest ARM64)' || (github.ref == 'refs/heads/fix/zenora-dialog-sync-cache-20261122' && 'ZenoraChat Dialog Sync & Local Cache (ARM64)' || (github.ref == 'refs/heads/fix/zenora-dialog-avatars-mute-sender-20261122' && 'ZenoraChat Dialog Avatars, Mute & Sender (ARM64)' || (github.ref == 'refs/heads/fix/zenora-session-rooms-stability-20261122' && 'ZenoraChat Session & Rooms Stability (ARM64)' || 'ZenoraChat Login & Dialog Stability (ARM64)'))) }}
          body_path: dist/debug-preview-notes.md
          files: |
            dist/ZenoraChat-debug-arm64.apk
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
